spring.application.name=RestaurantBackEndApp
spring.config.import=optional:file:./properties/secrets.properties
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=9090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zeroonesrestaurantdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver



#JPA -hibernate properties
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql =true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#true ? OSIV enabled ? session open through request

#false ? OSIV disabled ? session only open inside transactions

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
#jwt.expiration=3600000
#Adding logging

logging.file.name=logs/application.log

#Log formats (optional but nice)
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

#Log levels
logging.level.root=INFO
logging.level.com.abhi=DEBUG

#Hibernate SQL (queries) in logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
