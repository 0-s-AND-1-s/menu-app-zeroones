<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SignUp Page</title>
</head>
<body>
<form th:action="@{/users/register}" method="POST">
    <div>
        <label for="userName">Username:</label>
        <input type="text" id="userName" name="userName" required>
    </div>
    <div>
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" required>
    </div>
    <div>
        <label for="customerauthority">Authority Level:</label>
        <input type="checkbox" name="authorityType" id="customerauthority" value="ROLE_CUSTOMER" checked> CUSTOMER
    </div>
    <div>
        <label for="adminauthority">Authority Level:</label>
        <input type="checkbox" name="authorityType" id="adminauthority" value="ROLE_ADMIN"> ADMIN
    </div>
    <button type="submit">Register</button>
</form>

</body>
</html>
